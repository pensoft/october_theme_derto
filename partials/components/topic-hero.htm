<section class="topic-hero" data-topic-slug="{{ topic.slug }}" style="--topic-bg-image: url('{% if topic.cover %}{{ topic.cover.path }}{% else %}{{ 'assets/images/multifunctional.png'|theme }}{% endif %}')">
    <div class="hero-background">
        <div class="container">
            <div class="row">
                <div class="col-md-10 col-xs-12 content">
                    <div class="topic-hero-content">
                        <p class="topic-subtitle">Course on Ecological Restoration</p>
                        <h1 class="topic-title">{{ topic.name }}</h1>
                    </div>
                </div>
                <div class="col-md-2 col-xs-12 arrows">
                    <div class="topic-navigation">
                        <a href="/topic/{{ prevTopic.slug }}" class="nav-arrow prev-arrow" title="Previous Topic"></a>
                        <a href="/topic/{{ nextTopic.slug }}" class="nav-arrow next-arrow" title="Next Topic"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
